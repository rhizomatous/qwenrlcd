[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwenrlcd"
version = "0.1.0"
description = "Experiments in fast, typed, calibrated language-model decisions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate==1.15.0",
  "datasets==4.8.5",
  "peft==0.21.0",
  "safetensors>=0.5",
  "torch==2.14.0",
  "transformers==5.17.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
qwenrlcd-train = "qwenrlcd.train:main"
qwenrlcd-synthetic = "qwenrlcd.synthetic:main"
qwenrlcd-check-parallel = "qwenrlcd.check_parallel:main"
qwenrlcd-predict = "qwenrlcd.predict:main"
qwenrlcd-preflight = "qwenrlcd.preflight:main"
qwenrlcd-diagnose-choice = "qwenrlcd.diagnose_choice:main"
qwenrlcd-diagnose-development = "qwenrlcd.diagnose_development:main"
qwenrlcd-compare-score = "qwenrlcd.compare_score:main"
qwenrlcd-choice-capacity = "qwenrlcd.choice_capacity:main"
qwenrlcd-choice-capacity-report = "qwenrlcd.choice_capacity_report:main"
qwenrlcd-benchmark = "qwenrlcd.benchmark:main"
qwenrlcd-benchmark-training = "qwenrlcd.benchmark_training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenrlcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
